<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flashlight Maze</title>
<style>

  #over { position: fixed; inset: 0; display: grid; place-items: center; background: #050409c8; }

  .card h2 { margin: 0 0 4px; font-size: 26px; } .card h3 { margin: 14px 0 4px; font-size: 14px; color: #ffd27a; text-align: left; }

          border: 2px solid #ffd27a99; background: #ffd27a33; color: #fff; font: 800 14px system-ui, sans-serif; touch-action: none; }

<body>
<canvas id="game"></canvas>
<div class="hud" id="top"><div id="keys"></div><div id="team"></div></div>
<div class="hud" id="hint"></div>
<div class="hud" id="msg"></div>

  <button class="go" id="again">Play again</button>
</div></div>
<script>
/* ═══ FLASHLIGHT MAZE · a Multiplayer Agent starter ══════════════════════════════════════
 * Find three keys in a pitch-black maze while something hunts you. Co-op, 1–4 players;
 * bot teammates fill empty seats.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ speeds, light, the stalker's senses, timers, maze size
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   MAZE .......... building the maze from a seed: corridors, loops, keys, exit; walls, sight, paths
 *   RUN (HOST) .... phases, keys, freeing caught friends, the exit, the stalker, the bot teammates.
 *                   Only the host runs this and writes shared state.
 *   ME ............ walking, aiming, the light switch. Each player writes only its own.
 *   DRAW .......... camera, the maze, people, the stalker, darkness and flashlight cones
 *   HUD & RESULTS . keys, team, messages, the results card, leaderboard, sound
 *   INPUT ......... keyboard, mouse aim, touch stick and light button
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - Each player writes its OWN entity: `p` (one JSON field: position, aim, light on/off,
 *     moving) about 12 times a second, `hb` (heartbeat) once a second, `n`/`c` once.
 *   - The HOST is the lowest sessionId among live players (heartbeat seen in the last 3s),
 *     worked out every frame. Only the host writes the shared fields: `game` (id, version
 *     `v`, seed, phase, timers incl. when the stalker wakes, which keys are found and by whom, who is caught and who is
 *     being freed), `mon` (the stalker, ~10/s) and `bots`. A new host adopts all three.
 *   - Every client builds the same maze from game.seed (a seeded PRNG).
 *   - There are no intents to send but "again" {}: the host sees everyone's position, so it
 *     picks up keys, frees caught players and opens the exit itself.
 *   - The stalker sees a flashlight from far away and hears footsteps; a light in its face
 *     slows it down. It downs who it catches.
 *   - ?attract plays offline with bots only (the preview video is recorded from it).
 *   - Leaderboard "fastest-escape": the team's time, stored as 3600000 - ms (boards keep
 *     the highest score), shown on the results card.
 */

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {

  loops: 0.14,            // share of extra walls knocked out, so there is more than one way round
  keys: 3,                // keys to find before the exit opens
  seats: 3,               // bot teammates fill the team up to this many
  speed: 3.4,             // your walking speed, tiles/s
  botSpeed: 3.1,          // bot teammates
  radius: 0.28,           // how wide a person is, in tiles
  light: { range: 7, angle: 0.6, ambient: 1.6, dark: 0.96 }, // flashlight reach (tiles) and half-width (radians), the glow around you, how dark the dark is
  // The stalker: speeds (tiles/s; it is faster than you), how much a flashlight in its face slows it,
  // how far it sees a lit / unlit person and hears footsteps, ms it sleeps at the start, stops after a catch, keeps chasing what it lost.
  stalker: { wander: 1.8, hunt: 2.6, chase: 3.4, inLight: 0.4, sight: 7, sightDark: 2.2, hear: 4, catch: 0.5, sleepMs: 8000, feedMs: 4000, giveUpMs: 2200 },
  reach: 0.7,             // how close you get to pick up a key or reach the exit
  freeMs: 2500,           // ms a teammate stands next to you to free you

  resultsMs: 15000,       // ms the results show before a new maze
  board: "fastest-escape",

const BOT_NAMES = ["Milo", "Nell", "Rook", "Ivy", "Sam", "June"];
const COLORS = ["#ff6b6b", "#4dabff", "#ffd23f", "#52d273", "#c77dff", "#ff9f43"];
const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'flashlight-maze',
  endpoint: 'wss://live.multiplayeragent.com',

const ATTRACT = new URLSearchParams(location.search).has("attract");

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */

    sessionId: id, state, offline: true,

    const mp = await Promise.race([MP.join({ ...MP_CONNECT }), new Promise((_, no) => setTimeout(() => no(new Error("timed out")), 10000))]);
    window.mp = mp; // the builder calls window.mp.leave() when the page closes

const parse = (v, fb) => { if (typeof v !== "string") return fb; try { return JSON.parse(v); } catch { return fb; } };

let net = null, S = { entities: { players: {} }, shared: {} };
const seenHb = new Map(); // sessionId -> { hb, at } on OUR clock
/** Players whose heartbeat moved in the last 3s (plus us), sorted by sessionId. */
function livePlayers() {
  const now = performance.now(), out = [];
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    const s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });

// ── MAZE ────────────────────────────────────────────────────────────────────────────

}
const solid = (M, x, y, open) => { if (x < 0 || y < 0 || x >= M.W || y >= M.H) return true; const w = M.wall[y * M.W + x]; return w === 1 || (w === 2 && !open); };

}
/** Tile centres from a to b, along the corridors (empty if there's no way). */
function route(M, a, b, open) {
  const tx = Math.floor(b.x), ty = Math.floor(b.y), d = bfs(M, tx, ty, open); let x = Math.floor(a.x), y = Math.floor(a.y), out = [];

    const [dx, dy] = DIRS.find(([dx, dy]) => d[(y + dy) * M.W + x + dx] >= 0 && d[(y + dy) * M.W + x + dx] === d[y * M.W + x] - 1) || [0, 0];

}

const canSee = (M, a, b, open) => castRay(M, a.x, a.y, Math.atan2(b.y - a.y, b.x - a.x), dist(a, b), open) >= dist(a, b) - 0.05;

/** Move a round body by (dx, dy) and push it out of any wall it ends up in. */

    b.x += mx; b.y += my;

const host = { last: null, was: false, bots: new Map(), mon: null, lastPub: 0, known: new Set(), visited: new Set(), runId: -1 };
/** The run as state has it, or the host's own newer write that hasn't come back yet. `v` only goes up. */
function game() {

}

const humans = () => livePlayers().filter((id) => !(ATTRACT && id === net.sessionId));
/** Spot n near the start (players take 0–3, bots after them), each a little apart. */

/** Everyone in the maze: { id, name, color, x, y, a, l (light), m (moving), bot, mine }. */

/** Everyone to draw: me from my own state, others eased toward their reports, bots from the host (or its snapshot). */
function gather(g, dt) {

    let v = views.get(p.id); if (!v || dist(v, p) > 3) { v = { x: p.x, y: p.y, a: p.a }; views.set(p.id, v); }
    v.x += (p.x - v.x) * k; v.y += (p.y - v.y) * k; v.a += angDiff(p.a, v.a) * k; seen.add(p.id);

// ── HUD & RESULTS ───────────────────────────────────────────────────────────────────
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const fmt = (ms) => `${Math.floor(ms / 60000)}:${String(Math.floor((ms % 60000) / 1000)).padStart(2, "0")}`;
let board = null, msgTimer = 0, seen = { run: -1, keys: "", down: "", phase: "" };
function say(text, ms = 2200) { const m = $("msg"); m.textContent = text; m.classList.add("on"); clearTimeout(msgTimer); msgTimer = setTimeout(() => m.classList.remove("on"), ms); }
/** React to changes in the run (keys found, someone caught or freed, the exit, the end), on every screen alike. */
function onChanges(g, all) {
  if (seen.run !== g.id) { seen = { run: g.id, keys: JSON.stringify(g.keys), down: JSON.stringify(g.down), phase: g.phase }; if (g.phase === "brief") me.played = g.id; return; }
  const keys = JSON.stringify(g.keys), down = JSON.stringify(g.down);
  if (keys !== seen.keys) {
    const before = parse(seen.keys, []); g.keys.forEach((k, i) => { if (k.by && before[i] && !before[i].by) { if (!ATTRACT) say(isOpen(g) ? "The exit is open! Get out!" : `${k.by} found a key`); sfx(isOpen(g) ? "open" : "key"); for (let j = 0; j < 20; j++) sparks.push({ x: k.x, y: k.y, vx: (Math.random() - 0.5) * 4, vy: (Math.random() - 0.5) * 4, life: 0.8, color: "#ffd23f" }); } });
    seen.keys = keys;
  }
  if (down !== seen.down) {
    const before = parse(seen.down, {});
    for (const id of Object.keys(g.down)) if (!before[id]) { const p = all.find((c) => c.id === id); if (!ATTRACT) say(id === net.sessionId ? "It got you!" : `It got ${p ? p.name : "someone"}! Stand next to them to set them free`); sfx("caught"); }
    for (const id of Object.keys(before)) if (!g.down[id] && g.phase === "hunt") { const p = all.find((c) => c.id === id); if (!ATTRACT && p) say(`${p.mine ? "You are" : p.name + " is"} free`, 1500); }

  }

}
function hud(g, all) {
  $("caught").hidden = !g.down[net.sessionId] || g.phase !== "hunt" || ATTRACT;
  if (ATTRACT) return;
  const found = g.keys.filter((k) => k.by).length, t = g.phase === "won" ? g.ms : g.phase === "hunt" ? Date.now() - g.startAt : 0;
  $("keys").innerHTML = `🔑 ${found}/${g.keys.length}${isOpen(g) ? " · exit open!" : ""} <small>${fmt(Math.max(0, t))}</small>`;
  $("team").innerHTML = all.map((p) => `<div class="${g.down[p.id] ? "down" : ""}"><i style="background:${esc(p.color)}"></i>${esc(p.mine ? "You" : p.name)}${p.bot ? " 🤖" : ""}</div>`).join("");
  const n = livePlayers().length;
  $("net").textContent = net.offline ? "Offline: playing with bots" : `Online · ${n} player${n === 1 ? "" : "s"}${isHost() ? " · you run the stalker" : ""}`;
  $("hint").style.opacity = g.phase === "brief" || (g.phase === "hunt" && Date.now() - g.startAt < 7000) ? 1 : 0;
  $("hint").innerHTML = g.phase === "brief" ? `It wakes in ${Math.ceil((g.startAt - Date.now()) / 1000)}…<br>Find ${g.keys.length} keys, then the exit.` : touchUI ? "Drag to walk. Your light finds the way, but it sees the light too. Shine it in its face to slow it." : "WASD to walk, mouse to aim, F to switch the light. It sees your light: shine it in its face to slow it.";

  $("overText").textContent = won ? `${g.by} reached the exit. Time: ${fmt(g.ms)}` : `${g.keys.filter((k) => k.by).length} of ${g.keys.length} keys found. A new maze is coming.`;
  setTimeout(() => { if (game()?.phase === g.phase && game()?.id === g.id) $("over").hidden = false; }, 1200);
  const list = $("board");

    list.innerHTML = entries.length ? entries.map((e) => `<li>${esc(e.username || "Player")}<span>${fmt(3600000 - e.score)}</span></li>`).join("") : "<li class=\"note\">No escapes yet. Be the first.</li>";
  }).catch(() => { list.innerHTML = "<li class=\"note\">Couldn't load the leaderboard.</li>"; });

$("again").onclick = () => { const g = game(); if (!g || (g.phase !== "won" && g.phase !== "lost")) return; if (isHost()) startRun(g.id + 1); else net.send("again", {}); };
let audio = null, nextBeat = 0;
function sfx(kind) {

/** A heartbeat that speeds up as the stalker gets closer to you. */

const takenColors = () => new Set([...livePlayers().filter((id) => id !== net.sessionId).map((id) => S.entities.players[id]?.c), ...shared("bots", []).map((b) => b.c)]);

function fixColor() {
  const others = livePlayers().filter((id) => id !== net.sessionId), botColors = isHost() ? [...host.bots.values()].map((b) => b.color) : shared("bots", []).map((b) => b.c);
  if (!others.some((id) => S.entities.players[id]?.c === myColor && id < net.sessionId) && !botColors.includes(myColor)) return;
  const taken = new Set([...others.map((id) => S.entities.players[id]?.c), ...botColors]), free = COLORS.find((c) => !taken.has(c));

// ── INPUT ───────────────────────────────────────────────────────────────────────────
const touchUI = matchMedia("(pointer: coarse)").matches && !ATTRACT;
$("lamp").hidden = !touchUI;
const wake = () => { if (!audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch {} } };
const KEYS = { ArrowUp: "up", w: "up", W: "up", ArrowDown: "down", s: "down", S: "down", ArrowLeft: "left", a: "left", A: "left", ArrowRight: "right", d: "right", D: "right" };
addEventListener("keydown", (e) => { wake(); const k = KEYS[e.key]; if (k) { e.preventDefault(); input[k] = true; } if ((e.key === "f" || e.key === "F" || e.key === " ") && !e.repeat) { e.preventDefault(); toggleLight(); } });

addEventListener("blur", () => { for (const k in input) input[k] = false; });

  if (e.pointerType === "mouse") { mouse.x = e.clientX; mouse.y = e.clientY; mouse.at = performance.now(); }

});
for (const ev of ["pointerup", "pointercancel"]) cv.addEventListener(ev, (e) => { if (e.pointerId === stick.id) { stick.id = -1; stick.x = stick.y = 0; } });
cv.addEventListener("contextmenu", (e) => e.preventDefault());
$("lamp").addEventListener("pointerdown", (e) => { e.preventDefault(); wake(); toggleLight(); });
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
let last = performance.now(), lastHb = 0, lastHud = 0;
function frame(now) {
  requestAnimationFrame(frame);
  if (performance.now() - lastTick > 1000) { hostHold = performance.now() + 700; host.was = false; } // the tab was frozen or in the background: someone else may have hosted meanwhile, so let its state arrive, then adopt it
  lastTick = performance.now(); // not the rAF time: after a long freeze Chrome can stamp the first frame from before it ended

    draw(g, M, all, dt, now);

}

(async function start() {
  net = await connect();
  net.onState((st) => { S = st; });
  net.on("again", () => { const g = game(); if (isHost() && g && (g.phase === "won" || g.phase === "lost")) startRun(g.id + 1); });
  net.onDisconnect(() => { $("net").textContent = "Reconnecting…"; });
  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const taken = takenColors();
  myColor = COLORS.find((c) => !taken.has(c)) || COLORS[Math.floor(Math.random() * COLORS.length)];
  net.me.set({ n: myName, c: myColor, hb: Date.now() });
  if (ATTRACT) { for (const id of ["top", "net", "hint"]) $(id).style.display = "none"; Object.assign(CONFIG, { seats: 4, briefMs: 200, resultsMs: 2500 }); Object.assign(CONFIG.stalker, { sleepMs: 0, hear: 9, sight: 10 }); }
  requestAnimationFrame(frame);
})();
